<!-- Supabase → Authentication → Email Templates → "Confirm signup"
     Subject:  [Brand Factory] 이메일 주소를 확인해 주세요
     Body 에 아래 전체를 붙여넣기. {{ .ConfirmationURL }} 은 Supabase 가 채운다. -->
<div style="margin:0;padding:40px 16px;background:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard',Helvetica,Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#fff;border-radius:6px;padding:40px 36px;color:#111;">
    <div style="font-size:13px;font-weight:700;letter-spacing:.12em;color:#111;margin-bottom:28px;">BRAND FACTORY</div>
    <h1 style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px;">이메일 주소를 확인해 주세요</h1>
    <p style="font-size:15px;line-height:1.7;color:#444;margin:0 0 28px;">
      Brand Factory 가입을 환영해요.<br>
      아래 버튼을 누르면 가입이 완료되고 바로 로고를 만들 수 있어요.
    </p>
    <a href="{{ .ConfirmationURL }}"
       style="display:inline-block;background:#111;color:#fff;text-decoration:none;font-size:14px;font-weight:700;letter-spacing:.04em;padding:14px 26px;border-radius:2px;">
      이메일 확인하기
    </a>
    <p style="font-size:12px;line-height:1.7;color:#888;margin:32px 0 0;">
      버튼이 안 눌리면 이 링크를 브라우저에 붙여넣어 주세요:<br>
      <span style="word-break:break-all;color:#666;">{{ .ConfirmationURL }}</span>
    </p>
    <hr style="border:none;border-top:1px solid #eee;margin:32px 0 18px;">
    <p style="font-size:12px;color:#999;margin:0;">
      본인이 가입한 게 아니라면 이 메일은 무시하셔도 됩니다.<br>
      Brand Factory · 클릭 몇 번으로 만드는 나만의 브랜드
    </p>
  </div>
</div>
